# HUMANLOCK - Cloudflare Pages
# Project deploys as static Pages, not a Worker.
# Build locally, then deploy: pnpm run deploy  (or ./scripts/deploy.sh)
# Dashboard alternative: connect git repo, set build command `pnpm build` and output `dist`.

name = "webmcp-humanlock"
compatibility_date = "2025-08-15"
pages_build_output_dir = "dist"

# Optional bindings: uncomment if you later add Pages Functions or KV
# [[kv_namespaces]]
# binding = "HUMANLOCK_KV"
# id = "replace-with-kv-id"
