<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-labelledby="title desc">
<title id="title">Humanlock logo - Human and AI Agent DNA symbiosis</title>
<desc id="desc">Two intertwined DNA helices in neon blue, purple and green on dark background, labeled Human and AI Agent, forming an X</desc>
<rect width="400" height="400" rx="24" fill="#070a14"/>
<defs>
  <linearGradient id="helix-human" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#0ea5e9"/>
    <stop offset="50%" stop-color="#3b82f6"/>
    <stop offset="100%" stop-color="#8b5cf6"/>
  </linearGradient>
  <linearGradient id="helix-agent" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#8b5cf6"/>
    <stop offset="50%" stop-color="#10b981"/>
    <stop offset="100%" stop-color="#00ff88"/>
  </linearGradient>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#00ff88" stop-opacity="0.25"/>
    <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
  </radialGradient>
  <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="6" result="blur"/>
    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
  </filter>
</defs>
<circle cx="200" cy="200" r="140" fill="url(#glow)" opacity="0.6"/>
<!-- Base DNA strands - X shape -->
<!-- Human strand (blue to purple, left top to right bottom) -->
<path d="M 95 55 C 125 95, 145 125, 165 165 C 185 205, 210 245, 240 285 C 260 315, 285 335, 315 345" fill="none" stroke="url(#helix-human)" stroke-width="14" stroke-linecap="round" opacity="0.95"/>
<path d="M 85 75 C 115 115, 135 145, 155 185 C 175 225, 200 265, 230 305 C 250 335, 275 355, 305 365" fill="none" stroke="url(#helix-human)" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
<!-- AI Agent strand (purple to green, right top to left bottom) -->
<path d="M 305 55 C 275 95, 255 125, 235 165 C 215 205, 190 245, 160 285 C 140 315, 115 335, 85 345" fill="none" stroke="url(#helix-agent)" stroke-width="14" stroke-linecap="round" opacity="0.95"/>
<path d="M 315 75 C 285 115, 265 145, 245 185 C 225 225, 200 265, 170 305 C 150 335, 125 355, 95 365" fill="none" stroke="url(#helix-agent)" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
<!-- Ladder rungs - horizontal connections -->
<g stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" opacity="0.9">
  <line x1="115" y1="105" x2="285" y2="105"/>
  <line x1="130" y1="135" x2="270" y2="135"/>
  <line x1="145" y1="165" x2="255" y2="165"/>
  <line x1="160" y1="195" x2="240" y2="195"/>
  <line x1="175" y1="225" x2="225" y2="225"/>
  <line x1="160" y1="255" x2="240" y2="255"/>
  <line x1="145" y1="285" x2="255" y2="285"/>
  <line x1="130" y1="315" x2="270" y2="315"/>
</g>
<!-- Nucleotide dots - glowing -->
<g filter="url(#softGlow)">
  <circle cx="115" cy="105" r="5.5" fill="#38bdf8"/>
  <circle cx="285" cy="105" r="5.5" fill="#a78bfa"/>
  <circle cx="130" cy="135" r="4.5" fill="#60a5fa"/>
  <circle cx="270" cy="135" r="4.5" fill="#34d399"/>
  <circle cx="145" cy="165" r="5" fill="#38bdf8"/>
  <circle cx="255" cy="165" r="5" fill="#c084fc"/>
  <circle cx="160" cy="195" r="6" fill="#00ff88"/>
  <circle cx="240" cy="195" r="6" fill="#00ff88"/>
  <circle cx="175" cy="225" r="4.5" fill="#a78bfa"/>
  <circle cx="225" cy="225" r="4.5" fill="#34d399"/>
  <circle cx="160" cy="255" r="5" fill="#60a5fa"/>
  <circle cx="240" cy="255" r="5" fill="#38bdf8"/>
  <circle cx="145" cy="285" r="4.5" fill="#a78bfa"/>
  <circle cx="255" cy="285" r="4.5" fill="#10b981"/>
  <circle cx="130" cy="315" r="5.5" fill="#38bdf8"/>
  <circle cx="270" cy="315" r="5.5" fill="#10b981"/>
  <!-- helix backbone dots -->
  <circle cx="105" cy="80" r="3.5" fill="#38bdf8" opacity="0.9"/>
  <circle cx="295" cy="80" r="3.5" fill="#c084fc" opacity="0.9"/>
  <circle cx="100" cy="150" r="3" fill="#60a5fa" opacity="0.8"/>
  <circle cx="300" cy="150" r="3" fill="#34d399" opacity="0.8"/>
  <circle cx="200" cy="200" r="4" fill="#00ff88" opacity="0.95"/>
  <circle cx="105" cy="270" r="3" fill="#38bdf8" opacity="0.8"/>
  <circle cx="295" cy="270" r="3" fill="#10b981" opacity="0.8"/>
  <circle cx="95" cy="330" r="3.5" fill="#8b5cf6" opacity="0.9"/>
  <circle cx="305" cy="330" r="3.5" fill="#00ff88" opacity="0.9"/>
</g>
<!-- Labels -->
<text x="28" y="208" fill="#f1f5f9" font-family="Space Grotesk, system-ui, sans-serif" font-size="18" font-weight="600" letter-spacing="0.02em" text-anchor="start">Human</text>
<text x="372" y="208" fill="#f1f5f9" font-family="Space Grotesk, system-ui, sans-serif" font-size="18" font-weight="600" letter-spacing="0.02em" text-anchor="end">AI Agent</text>
<!-- subtle particles -->
<g fill="#94a3b8" opacity="0.5">
  <circle cx="70" cy="110" r="1.5"/>
  <circle cx="330" cy="120" r="1.2"/>
  <circle cx="80" cy="190" r="1.8"/>
  <circle cx="320" cy="210" r="1.5"/>
  <circle cx="75" cy="300" r="1.3"/>
  <circle cx="325" cy="290" r="1.4"/>
</g>
</svg>
